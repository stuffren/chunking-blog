name: Build and Deploy

on:
  # 代码推送到 main 分支时触发
  push:
    branches: [main]

  # 每 6 小时定时触发，同步新发布的 Discussion
  schedule:
    - cron: '0 */6 * * *'

  # 支持手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 新增：CI 环境下 .env 文件不存在，需要动态创建
      - name: Create .env file
        run: |
          echo "VITE_GITHUB_OWNER=${{ secrets.GH_OWNER }}" > .env
          echo "VITE_GITHUB_REPO=${{ secrets.GH_REPO }}" >> .env
          echo "VITE_GISCUS_REPO_ID=${{ secrets.GISCUS_REPO_ID }}" >> .env
          echo "VITE_GISCUS_CATEGORY_ID=${{ secrets.GISCUS_CATEGORY_ID }}" >> .env

      # 4. 执行构建（自动触发 SSG）
      # 修改：注入 BASE_PATH，告知 Vite 和 SSG 脚本资源前缀为 /chunking-blog/
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /chunking-blog/
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          VITE_GITHUB_OWNER: ${{ secrets.GH_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.GH_REPO }}
          VITE_GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
      
      # 5. 创建 CNAME 文件（保留自定义域名配置）
      - name: Create CNAME file
        run: echo "envjs.fun" > ./dist/CNAME


      # 6. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./dist